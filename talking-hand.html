<!-- Talking Hand Puppet — uses MediaPipe Hands + back camera -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hand Puppet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600&display=swap');

  :root{
    --ink:#0b0b0f;
    --paper:#fdf6e3;
    --pop:#ff3b6b;
    --pop2:#1fd1c8;
    --gum:#c8295a;
    --tooth:#fffdf5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'DM Sans',sans-serif}

  #stage{position:fixed;inset:0;background:#000}
  video,canvas{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  video{transform:scaleX(1)} /* back cam, no mirror */
  canvas{pointer-events:none}

  /* ---- intro / permission screen ---- */
  #intro{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;gap:22px;
    background:
      radial-gradient(120% 80% at 50% -10%, #2a1340 0%, transparent 60%),
      radial-gradient(100% 100% at 50% 120%, #07252a 0%, transparent 60%),
      var(--ink);
    color:var(--paper);
  }
  #intro h1{
    font-family:'Bungee',sans-serif;font-size:clamp(34px,9vw,64px);
    line-height:.95;letter-spacing:-1px;
    background:linear-gradient(92deg,var(--pop),#ffb03a 55%,var(--pop2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transform:rotate(-3deg);
  }
  #intro p{max-width:330px;font-size:15px;line-height:1.5;opacity:.82}
  .demo{
    font-size:60px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
    animation:chomp 1.8s ease-in-out infinite;
  }
  @keyframes chomp{0%,40%,100%{transform:scaleY(1)}20%{transform:scaleY(.55)}}
  #go{
    font-family:'Bungee',sans-serif;font-size:19px;letter-spacing:.5px;
    border:none;border-radius:100px;padding:18px 40px;color:#fff;
    background:linear-gradient(110deg,var(--pop),#ff7a3a);
    box-shadow:0 10px 0 #9c1338, 0 18px 30px rgba(255,59,107,.35);
    cursor:pointer;transition:transform .08s, box-shadow .08s;
  }
  #go:active{transform:translateY(8px);box-shadow:0 2px 0 #9c1338,0 6px 14px rgba(255,59,107,.3)}
  .hint{font-size:12.5px;opacity:.55;max-width:300px}

  /* ---- HUD ---- */
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;pointer-events:none;
    font-size:13px;color:#fff;font-weight:600;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  #status{
    background:rgba(0,0,0,.4);backdrop-filter:blur(8px);
    padding:8px 14px;border-radius:100px;display:flex;align-items:center;gap:8px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#ff5252;
       box-shadow:0 0 0 0 rgba(255,82,82,.6);animation:pulse 1.4s infinite}
  .dot.live{background:#22e07a;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,82,82,.5)}70%{box-shadow:0 0 0 9px transparent}}
  #flip{
    pointer-events:auto;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);
    border:none;color:#fff;font-size:20px;width:42px;height:42px;border-radius:50%;cursor:pointer;
  }

  #toast{
    position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:25;
    background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:#fff;
    padding:12px 20px;border-radius:100px;font-size:14px;font-weight:600;
    text-align:center;max-width:88vw;transition:opacity .4s;text-shadow:0 1px 3px #000;
  }
  .err{color:#ffd2d2}
</style>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="draw"></canvas>
</div>

<div id="hud" style="display:none">
  <div id="status"><span class="dot" id="dot"></span><span id="stxt">looking…</span></div>
  <button id="flip" title="switch camera">⟳</button>
</div>

<div id="toast" style="display:none"></div>

<div id="intro">
  <div class="demo">😬</div>
  <h1>Hand<br>Puppet</h1>
  <p>Make a sideways fist like in your photo. The gap between your fingers and thumb becomes a mouth — open your thumb and it shows its teeth!</p>
  <button id="go">Start camera →</button>
  <div class="hint">Uses your back camera. Nothing leaves your device — all tracking runs locally in the browser.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video  = document.getElementById('cam');
const canvas = document.getElementById('draw');
const ctx    = canvas.getContext('2d');
const intro  = document.getElementById('intro');
const hud    = document.getElementById('hud');
const dot    = document.getElementById('dot');
const stxt   = document.getElementById('stxt');
const toastEl= document.getElementById('toast');

let facing = 'environment';   // back camera
let stream = null;
let hands  = null;
let running = false;
let smoothOpen = 0;           // smoothed mouth openness 0..1
let blink = 0, lastBlink = performance.now();

function toast(msg, isErr){
  toastEl.style.display='block';
  toastEl.className = isErr ? 'err' : '';
  toastEl.textContent = msg;
  toastEl.style.opacity='1';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ toastEl.style.opacity='0'; }, 3200);
}

function fit(){
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
}
window.addEventListener('resize', fit);

// ---------- camera ----------
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal: facing }, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
  }catch(e){
    // fallback: any camera
    try{ stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    catch(err){ toast('Camera blocked. Allow camera access and reload.', true); throw err; }
  }
  video.srcObject = stream;
  await video.play();
  fit();
}

// ---------- MediaPipe ----------
function initHands(){
  hands = new Hands({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands:1, modelComplexity:0,
                     minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  hands.onResults(onResults);
}

// pump frames manually (avoids the extra camera_utils dependency)
async function loop(){
  if(running && video.readyState>=2){
    try{ await hands.send({image:video}); }catch(e){}
  }
  requestAnimationFrame(loop);
}

// ---------- geometry helpers ----------
const px = p => ({ x:p.x*canvas.width, y:p.y*canvas.height });
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function onResults(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];

  if(!lm){
    dot.classList.remove('live'); stxt.textContent='show your hand';
    return;
  }
  dot.classList.add('live'); stxt.textContent='puppet live';

  // landmark map:
  //  0 wrist | 4 thumb tip | 8/12/16/20 finger tips
  //  5/9/13/17 = finger BASES (the knuckle row across the back of the hand)
  const wrist    = px(lm[0]);
  const thumbTip = px(lm[4]);
  const tips     = [px(lm[8]),px(lm[12]),px(lm[16]),px(lm[20])];
  const knuck    = [px(lm[5]),px(lm[9]),px(lm[13]),px(lm[17])];

  const avg = arr => ({
    x: arr.reduce((s,p)=>s+p.x,0)/arr.length,
    y: arr.reduce((s,p)=>s+p.y,0)/arr.length
  });
  const tipsC  = avg(tips);     // where the curled fingertips cluster
  const knuckC = avg(knuck);    // centre of the knuckle row  -> the "forehead"

  // hand scale: knuckles -> wrist is a stable reference length
  const palm = dist(knuckC, wrist) || 1;

  // ---- mouth openness ----
  // sideways fist: fingertips meet the thumb. The gap between them = the mouth.
  // closed fist -> small gap; thumb drops open -> larger gap.
  const gap = dist(thumbTip, tipsC) / palm;     // ~0.25 closed .. ~1.0 open
  let open = (gap - 0.32) / 0.55;
  open = Math.max(0, Math.min(1, open));
  smoothOpen += (open - smoothOpen) * 0.4;

  drawFace({wrist, thumbTip, tipsC, knuckC, palm, open:smoothOpen});
}

// ---------- the puppet face ----------
function drawFace(d){
  const { wrist, thumbTip, tipsC, knuckC, palm, open } = d;

  // MOUTH sits on the line between the curled fingertips and the thumb tip,
  // biased toward the fingertips (where the real gap/crease is) and nudged a
  // touch toward the knuckles so it lands ON the hand, not below it.
  let mx = tipsC.x*0.6 + thumbTip.x*0.4;
  let my = tipsC.y*0.6 + thumbTip.y*0.4;
  let kx = knuckC.x - mx, ky = knuckC.y - my;
  const kl = Math.hypot(kx,ky)||1; kx/=kl; ky/=kl;
  const mouth = { x: mx + kx*palm*0.10, y: my + ky*palm*0.10 };

  // mouth opening axis = fingertips -> thumb
  const ang = Math.atan2(thumbTip.y-tipsC.y, thumbTip.x-tipsC.x);
  const mouthLen = palm*0.85;
  const openPx   = open*palm*0.62;

  ctx.save();
  ctx.translate(mouth.x, mouth.y);
  ctx.rotate(ang);

  // ---- MOUTH ----
  const hw = mouthLen/2;
  const lipTop = -openPx/2 - 6*devicePixelRatio;
  const lipBot =  openPx/2 + 6*devicePixelRatio;

  // mouth cavity
  ctx.beginPath();
  ctx.moveTo(-hw,0);
  ctx.quadraticCurveTo(0, lipTop*1.15, hw, 0);
  ctx.quadraticCurveTo(0, lipBot*1.15, -hw, 0);
  ctx.closePath();
  const grd = ctx.createLinearGradient(0,lipTop,0,lipBot);
  grd.addColorStop(0,'#7a0d2b'); grd.addColorStop(.5,'#3a0212'); grd.addColorStop(1,'#7a0d2b');
  ctx.fillStyle=grd; ctx.fill();

  // teeth — only meaningfully visible once the mouth opens
  if(open>0.12){
    const teethH = Math.min(openPx*0.42, palm*0.16);
    ctx.fillStyle='#fffdf5';
    // top row
    drawTeeth(-hw*0.8, hw*0.8, lipTop*0.55, teethH, true);
    // bottom row
    drawTeeth(-hw*0.8, hw*0.8, lipBot*0.55 - teethH, teethH, false);
  }

  // tongue when wide open
  if(open>0.55){
    ctx.beginPath();
    ctx.fillStyle='#ff5e7a';
    const tw=hw*0.55, th=openPx*0.30;
    ctx.ellipse(0, lipBot*0.45, tw, th, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // lips outline
  ctx.lineWidth=7*devicePixelRatio; ctx.strokeStyle='var(--gum)';
  ctx.strokeStyle='#c8295a';
  ctx.beginPath();
  ctx.moveTo(-hw,0);
  ctx.quadraticCurveTo(0, lipTop*1.15, hw, 0);
  ctx.quadraticCurveTo(0, lipBot*1.15, -hw, 0);
  ctx.closePath(); ctx.stroke();

  ctx.restore();

  // ---- EYES ----
  // The knuckle row (knuckC) IS the back-of-hand "forehead" — anchor eyes there
  // directly, nudged a little further from the mouth toward the wrist so they
  // sit on the flat of the hand rather than on the lips.
  let dirX = knuckC.x - mouth.x, dirY = knuckC.y - mouth.y;
  const dl = Math.hypot(dirX,dirY) || 1; dirX/=dl; dirY/=dl;
  const eyeCenter = {
    x: knuckC.x + dirX*palm*0.18,
    y: knuckC.y + dirY*palm*0.18
  };

  // spread the two eyes along the knuckle row (perpendicular to mouth->knuckle)
  const along = Math.atan2(dirY, dirX) + Math.PI/2;
  const spread = palm*0.34;
  const eR = palm*0.20;            // smaller, more proportionate eyes

  // blink timing — rare and quick (so it's not caught half-closed every frame)
  const now=performance.now();
  if(now-lastBlink>4500+Math.random()*4000){ blink=1; lastBlink=now; }
  blink = Math.max(0, blink-0.28);
  const lid = 1 - Math.min(1,blink);

  for(const s of [-1,1]){
    const ex = eyeCenter.x + Math.cos(along)*spread*s;
    const ey = eyeCenter.y + Math.sin(along)*spread*s;
    drawEye(ex,ey,eR,lid,open);
  }
}

function drawTeeth(x0,x1,y,h,top){
  const n=5, w=(x1-x0)/n;
  for(let i=0;i<n;i++){
    const x=x0+i*w;
    ctx.beginPath();
    const r=3*devicePixelRatio;
    // rounded rect tooth
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
    ctx.fillStyle='#fffdf5'; ctx.fill();
    ctx.lineWidth=1.5*devicePixelRatio; ctx.strokeStyle='rgba(150,120,120,.35)'; ctx.stroke();
  }
}

function drawEye(x,y,r,lid,open){
  ctx.save();
  ctx.translate(x,y);

  // clip everything to the eye circle so the lid can never spill out as a square
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();

  // white
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  // pupil — drifts slightly for life
  const pr=r*0.46;
  const off=r*0.18;
  ctx.beginPath();
  ctx.arc(off*Math.sin(performance.now()/700), off*0.4, pr, 0, Math.PI*2);
  ctx.fillStyle='#0b0b12'; ctx.fill();
  // glint
  ctx.beginPath();
  ctx.arc(-pr*0.3, -pr*0.3, pr*0.32, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();

  // eyelid (blink): a dark cap sliding down from the top, clipped to the eye
  if(lid<0.98){
    const lidY = -r + (2*r)*(1-lid);   // 0 = open(top), 2r = fully closed
    ctx.beginPath();
    ctx.rect(-r-2, -r-2, (r+2)*2, (lidY+r+2));
    ctx.fillStyle='#1a1a22'; ctx.fill();
  }

  ctx.restore();

  // outline drawn last, on top, unclipped
  ctx.save();
  ctx.translate(x,y);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
  ctx.lineWidth=3*devicePixelRatio; ctx.strokeStyle='#101018'; ctx.stroke();
  ctx.restore();
}

// ---------- boot ----------
document.getElementById('go').addEventListener('click', async ()=>{
  if(typeof Hands==='undefined'){
    toast('Tracking library failed to load. Check your connection and reload.', true);
    return;
  }
  document.getElementById('go').textContent='Loading…';
  try{
    await startCam();
    initHands();
    intro.style.display='none';
    hud.style.display='flex';
    running=true;
    loop();
    toast('Make a sideways fist & wiggle your thumb 👋');
  }catch(e){
    document.getElementById('go').textContent='Start camera →';
  }
});

document.getElementById('flip').addEventListener('click', async ()=>{
  facing = facing==='environment' ? 'user' : 'environment';
  running=false;
  await startCam();
  running=true;
});
</script>
