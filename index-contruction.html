<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FAF8F5;
    --dark:#1E2A4A;
    --amber:#E8A042;
    --red:#E8614A;
    --coral:#E8614A;
    --mid:#4A5568;
    --light:#E8E4DC;
    --paper:#FFFFFF;
    --navy:#1E2A4A;
    --gold:#E8A042;
  }
  body{background:var(--cream);color:var(--dark);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
  .app{max-width:560px;width:100%;text-align:center}
  .masthead{padding:1.2rem 0 1.5rem;margin-bottom:1.5rem;border-bottom:1px solid rgba(30,42,74,.1)}
  .masthead-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px}
  .masthead-icon{width:70px;height:70px;flex-shrink:0;object-fit:contain}
  .masthead-wordmark{text-align:left}
  .masthead h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;line-height:1;font-weight:700;letter-spacing:-.5px;color:var(--dark)}
  .masthead h1 span{color:var(--coral)}
  .masthead-tagline{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mid);margin-top:1px}
  .masthead p{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;color:var(--mid);opacity:.7}

  .vinyl-divider{display:flex;align-items:center;gap:10px;margin:1.5rem 0;color:var(--coral);font-size:11px;letter-spacing:2px;font-weight:600;text-transform:uppercase}
  .vinyl-divider::before,.vinyl-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--coral));opacity:.4}

  .paper-box{background:var(--paper);border:1px solid rgba(30,42,74,.1);border-radius:12px;padding:2rem 1.5rem;box-shadow:0 2px 12px rgba(30,42,74,.06)}
  .paper-box-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin-bottom:1rem}
  .paper-box h2{font-family:'Cormorant Garamond',serif;font-size:1.7rem;line-height:1.2;font-weight:600;color:var(--dark);margin-bottom:1rem}
  .paper-box .lead{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-style:italic;color:var(--dark);margin-bottom:1rem;line-height:1.5}
  .paper-box .small{font-size:14px;line-height:1.6;color:var(--mid)}
  .paper-box .small + .small{margin-top:.75rem}

  .contact{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid rgba(30,42,74,.08);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mid)}
  .contact a{color:var(--coral);text-decoration:none;font-weight:600;letter-spacing:.5px;text-transform:none;font-size:14px}
  .contact a:hover{text-decoration:underline}

  footer{margin-top:2rem;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);opacity:.6}
</style>

  <div class="app">

        </div>
